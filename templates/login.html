<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 0;
    }

    .card {
      max-width: 420px;
      margin: 70px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin-top: 0;
      color: #ffffff;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #d2d9e4;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      margin-top: 16px;
      width: 100%;
      padding: 12px;
      background: #2f6fed;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .message {
      margin: 12px 0;
      padding: 10px;
      border-radius: 8px;
    }

    .success {
      background: #e8f8ed;
      color: #1f7d45;
    }

    .error {
      background: #fdeaea;
      color: #b42318;
    }

    .switch {
      margin-top: 16px;
      text-align: center;
    }

    a {
      color: #2f6fed;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Login</h1>
    {{message}}
    <form method="post" action="/login">
      <label for="username_or_email">Username or Email</label>
      <input id="username_or_email" name="username_or_email" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required />

      <button type="Submit">Log In</button>
    </form>
    <div class="switch">
      <p>Don’t have an account? <a href="/signup">Create one</a></p>
    </div>
  </div>
</body>

</html>
